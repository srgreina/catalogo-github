name: Catálogo mensual

on:
  schedule:
    # Día 1 de cada mes a las 03:37 UTC (04:37/05:37 en España). Se evita el minuto 0:
    # a esa hora GitHub tiene picos de carga y retrasa o descarta ejecuciones programadas.
    - cron: "37 3 1 * *"
  workflow_dispatch:       # lanzable a mano desde la pestaña Actions
    inputs:
      completa:
        description: "Búsqueda completa (si no, solo repos con actividad desde la vez anterior)"
        type: boolean
        default: false

permissions:
  contents: write   # guardar histórico, novedades, caché de traducciones y estado
  pages: write      # publicar la web
  id-token: write   # requerido por deploy-pages

concurrency:
  group: catalogo-mensual
  cancel-in-progress: false

env:
  # Si existe el secreto CATALOGO_TOKEN (token personal) se usa; si no, el automático.
  GITHUB_TOKEN: ${{ secrets.CATALOGO_TOKEN || secrets.GITHUB_TOKEN }}
  PYTHONUNBUFFERED: "1"

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      repos: ${{ steps.resumen.outputs.repos }}
      novedades: ${{ steps.resumen.outputs.novedades }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar modelos de traducción
        uses: actions/cache@v6
        with:
          path: .argos
          key: argos-modelos-v1

      # La caché de Actions caduca a los 7 días sin usarse, y con ejecución mensual
      # siempre habrá caducado. Los modelos están también en una Release del repo
      # (bajan en segundos; desde argos-net.com tardarían ~45 min).
      - name: Modelos de traducción desde la Release (si no hay caché)
        run: |
          if [ ! -d .argos/en_es ]; then
            echo "Sin caché de modelos: los bajo de la Release"
            if gh release download modelos-argos -p argos-modelos.tar.gz -R "${{ github.repository }}"; then
              tar -xzf argos-modelos.tar.gz && rm argos-modelos.tar.gz
            else
              echo "::warning::No se pudo bajar la Release; traducir.py los bajará de argos-net.com (lento)"
            fi
          fi

      - name: Búsqueda de GitHub por topics
        run: python scripts/recopilar_github.py ${{ inputs.completa && '--completa' || '' }}

      - name: Registro oficial de MCP
        run: python scripts/recopilar_registro_mcp.py

      - name: Listas awesome
        run: python scripts/recopilar_awesome.py

      - name: Unir fuentes
        run: python scripts/unir.py

      - name: Clasificar
        run: python scripts/clasificar.py

      - name: Traducir descripciones
        run: python scripts/traducir.py --max-minutos 150

      # Si el catálogo baja más de un 15 % respecto al mes anterior, este paso falla
      # y no se guarda ni se publica nada (la web anterior se queda).
      - name: Generar datos de la web
        run: python scripts/generar_web.py

      - name: Resumen para el aviso
        id: resumen
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("docs/datos.json", encoding="utf-8"))
          print(f"repos={len(d['repos'])}")
          print(f"novedades={sum(1 for r in d['repos'] if r.get('nv'))}")
          EOF

      - name: Guardar histórico, novedades, traducciones, estado y descartes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.json data/novedades.json data/cache_traducciones.json \
                  data/estado_github.json data/descartes.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Actualización mensual del catálogo ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main   # por si main cambió durante la ejecución
            git push
          fi

      - name: Preparar la web
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5

  # Aviso del resultado: se crea un Issue que menciona al propietario, así llega
  # notificación (correo y app móvil de GitHub). El de éxito se cierra al crearlo;
  # el de fallo queda abierto.
  avisar:
    needs: [generar, publicar]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Avisar del resultado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENERAR: ${{ needs.generar.result }}
          PUBLICAR: ${{ needs.publicar.result }}
          REPOS: ${{ needs.generar.outputs.repos }}
          NOVEDADES: ${{ needs.generar.outputs.novedades }}
        run: |
          EJECUCION="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FECHA=$(date -u +%Y-%m-%d)
          if [ "$GENERAR" = "success" ] && [ "$PUBLICAR" = "success" ]; then
            URL=$(gh issue create -R "${{ github.repository }}" \
              --title "Catálogo actualizado ($FECHA)" \
              --body "@${{ github.repository_owner }} El catálogo mensual se ha actualizado: $REPOS repos y $NOVEDADES novedades. Web: https://${{ github.repository_owner }}.github.io/catalogo-github/ — Ejecución: $EJECUCION")
            gh issue close "$URL" -R "${{ github.repository }}"
          else
            gh issue create -R "${{ github.repository }}" \
              --title "FALLÓ la actualización del catálogo ($FECHA)" \
              --body "@${{ github.repository_owner }} La ejecución mensual ha fallado (generar: $GENERAR, publicar: $PUBLICAR). La web anterior sigue publicada. Revisa: $EJECUCION"
          fi
