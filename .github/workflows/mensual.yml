name: Catálogo mensual

on:
  schedule:
    # Día 1 de cada mes a las 03:37 UTC (04:37/05:37 en España). Se evita el minuto 0:
    # a esa hora GitHub tiene picos de carga y retrasa o descarta ejecuciones programadas.
    - cron: "37 3 1 * *"
  workflow_dispatch:       # lanzable a mano desde la pestaña Actions
    inputs:
      completa:
        description: "Búsqueda completa (si no, solo repos con actividad desde la vez anterior)"
        type: boolean
        default: false

permissions:
  contents: write   # guardar histórico, novedades, caché de traducciones y estado
  pages: write      # publicar la web
  id-token: write   # requerido por deploy-pages

concurrency:
  group: catalogo-mensual
  cancel-in-progress: false

env:
  # Si existe el secreto CATALOGO_TOKEN (token personal) se usa; si no, el automático.
  GITHUB_TOKEN: ${{ secrets.CATALOGO_TOKEN || secrets.GITHUB_TOKEN }}
  PYTHONUNBUFFERED: "1"

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar modelos de traducción
        uses: actions/cache@v6
        with:
          path: .argos
          key: argos-modelos-v1

      - name: Búsqueda de GitHub por topics
        run: python scripts/recopilar_github.py ${{ inputs.completa && '--completa' || '' }}

      - name: Registro oficial de MCP
        run: python scripts/recopilar_registro_mcp.py

      - name: Listas awesome
        run: python scripts/recopilar_awesome.py

      - name: Unir fuentes
        run: python scripts/unir.py

      - name: Clasificar
        run: python scripts/clasificar.py

      - name: Traducir descripciones
        run: python scripts/traducir.py --max-minutos 150

      - name: Generar datos de la web
        run: python scripts/generar_web.py

      - name: Guardar histórico, novedades, traducciones, estado y descartes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.json data/novedades.json data/cache_traducciones.json \
                  data/estado_github.json data/descartes.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Actualización mensual del catálogo ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main   # por si main cambió durante la ejecución
            git push
          fi

      - name: Preparar la web
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
